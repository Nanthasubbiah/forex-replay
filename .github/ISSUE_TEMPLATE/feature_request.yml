name: Feature request
description: Suggest an indicator, a broker/symbol behaviour, or a workflow improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Small and self-contained beats big and vague — the codebase is laid out
        so an indicator, a contract spec or a drawing tool can each be added
        without touching anything else.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the trading/backtesting task, not just the widget you want.
      placeholder: |
        I want to compare an ATR-based stop with a fixed-pip stop on the same run.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Simulation semantics (fills, margin, swap, slippage)
        - Indicators
        - Drawing tools / chart UX
        - Data formats (CSV, ZIP, other providers)
        - Strategy API
        - Statistics / reporting / export
        - Multi-symbol or portfolio replay
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to implement it?
      options:
        - "Yes, I can open a PR"
        - "Yes, with some guidance"
        - "No — just suggesting"
    validations:
      required: true
